name: Deploy

# R14: a merge to main produces a Terraform plan; apply waits for the owner's approval in the
# protected prod environment. OIDC only; no long-lived AWS keys.
#
# The repository is public, so logs and job summaries are public: the plan is shown only as
# `terraform show -no-color` (sensitive values redacted), never as JSON, and no plan file is
# uploaded. A leak check fails the job if the origin secret or alert email appears in it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_DIR: infra/envs/prod
  TF_VAR_ssm_kms_key_arn: ${{ vars.SSM_KMS_KEY_ARN }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Build the Lambda package (approved scenarios only)
        run: make package
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: risk-trainer-plan-${{ github.run_id }}
          role-skip-session-tagging: true
          mask-aws-account-id: true
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
      - name: Leak check (no secret in the plan text)
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -z "$ALERT_EMAIL" ]; then echo "The ALERT_EMAIL secret is not set."; exit 1; fi
          ORIGIN="$(aws ssm get-parameter --name /risk-trainer/prod/origin-verify --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$ORIGIN"
          for value in "$ORIGIN" "$ALERT_EMAIL"; do
            if grep -qF -- "$value" plan.txt; then
              echo "The plan text contains a secret value; refusing to publish it."
              exit 1
            fi
          done
          echo "No secret values in the plan text."
      - name: Plan summary
        run: |
          {
            echo "## Terraform plan (prod)"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The owner approves here (required reviewer, main only). The OIDC subject becomes
    # repo:dustenatx/risk-trainer:environment:prod, the only one the deploy role trusts.
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Build the Lambda package (reproducible, so it matches the reviewed plan)
        run: make package
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: risk-trainer-deploy-${{ github.run_id }}
          role-skip-session-tagging: true
          mask-aws-account-id: true
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - name: terraform apply
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=tfplan
          terraform -chdir="$TF_DIR" apply -input=false -lock-timeout=5m tfplan
      - name: Outputs
        run: terraform -chdir="$TF_DIR" output
